[package]
name = "ols-cpanel-broker"
version = "0.1.0"
edition = "2021"
description = "Minimal privileged broker for OLS-cPanel (G0-H prototype; plan sections 5.1-5.4)"
license = "GPL-3.0-only"
publish = false

[dependencies]
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
libc = "=0.2.167"
hmac = "=0.12.1"
sha2 = "=0.10.8"

[profile.release]
opt-level = 2
lto = true
panic = "abort"
strip = true
