# WebAdmin is disabled by disableWebAdmin; the listener is still loopback-only.
accessControl {
  allow                 127.0.0.1
  deny                  ALL
}
listener adminListener {
  address               127.0.0.1:7080
  secure                1
  keyFile               $SERVER_ROOT/admin/conf/webadmin.key
  certFile              $SERVER_ROOT/admin/conf/webadmin.crt
  clientVerify          0
}
