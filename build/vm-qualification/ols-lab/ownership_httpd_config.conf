# Empty-lab G0-A ownership configuration: OLS owns public 80/443 with a static lab vhost.
# Requires the product build (autoDetectCdn/enableUpdateCheck). Not a production configuration.
serverName                       ols-cpanel-lab
user                             nobody
group                            nobody
autoRestart                      1
enableChroot                     0
inMemBufSize                     60M
swappingDir                      /run/ols-cpanel/lshttpd/swap
statDir                          /run/ols-cpanel/status
shmDefaultDir                    /run/ols-cpanel/shm/
gracefulRestartTimeout           300
mime                             conf/mime.properties
showVersionNumber                0
adminEmails                      root@localhost
indexFiles                       index.html
disableWebAdmin                  1
autoDetectCdn                    0
enableUpdateCheck                0

errorlog logs/error.log {
    logLevel             INFO
    debugLevel           0
    rollingSize          10M
    enableStderrLog      1
}
accessLog logs/access.log {
    rollingSize          10M
    keepDays             7
}
tuning {
    maxConnections       200
    maxSSLConnections    200
    # HTTP/3 (FV-04): QUIC on the HTTPS listeners (UDP beside TCP, listener key enableQuic, default 1). Its shared
    # state lives under /run/ols-cpanel like every other (RV-30), never in a world-writable directory; the
    # compiler writes quicEnable 0 and enableQuic 0 when the operator opted out (/var/lib/ols-cpanel/http3.json).
    quicEnable           1
    quicShmDir           /run/ols-cpanel/shm/
    # Compression of dynamic and cached responses (OLS defaults it off; static files are compressed by
    # default). Brotli where the client offers it, gzip otherwise; compressed static copies kept up to date.
    enableGzipCompress   1
    enableDynGzipCompress 1
    gzipCompressLevel    6
    enableBrCompress     4
    gzipAutoUpdateStatic 1
    gzipStaticCompressLevel 6
    brStaticCompressLevel 6
}
accessDenyDir {
    dir                  /
    dir                  /etc/*
    dir                  /dev/*
    dir                  conf/*
    dir                  admin/conf/*
}
fileAccessControl {
    followSymbolLink     2
    checkSymbolLink      1
    requiredPermissionMask    000
    restrictedPermissionMask  000
}
# Required: without this block lscgid refuses every LSAPI start (cgidSuEXEC failed).
CGIRLimit {
    maxCGIInstances      20
    minUID               11
    minGID               10
    priority             0
    CPUSoftLimit         10
    CPUHardLimit         50
    memSoftLimit         2047M
    memHardLimit         2047M
    procSoftLimit        400
    procHardLimit        450
}
accessControl {
    allow                ALL
}
extProcessor ea-php83 {
    type                 lsapi
    address              uds://run/ols-cpanel/lshttpd/ea-php83.sock
    maxConns             5
    env                  PHP_LSAPI_CHILDREN=5
    initTimeout          60
    retryTimeout         0
    persistConn          1
    respBuffer           0
    autoStart            1
    path                 /opt/cpanel/ea-php83/root/usr/bin/lsphp
    backlog              50
    instances            1
    memSoftLimit         0
    memHardLimit         0
    procSoftLimit        400
    procHardLimit        500
}
virtualHost owner {
    vhRoot               /var/lib/ols-cpanel-lab/
    configFile           conf/vhosts/owner/vhconf.conf
    allowSymbolLink      0
    enableScript         0
    restrained           1
    setUIDMode           0
}
listener http4 {
    address              *:80
    secure               0
    map                  owner *
}
listener http6 {
    address              [ANY]:80
    secure               0
    map                  owner *
}
listener https4 {
    address              *:443
    secure               1
    keyFile              $SERVER_ROOT/conf/cert/lab.key
    certFile             $SERVER_ROOT/conf/cert/lab.crt
    map                  owner *
}
listener https6 {
    address              [ANY]:443
    secure               1
    keyFile              $SERVER_ROOT/conf/cert/lab.key
    certFile             $SERVER_ROOT/conf/cert/lab.crt
    map                  owner *
}
