# Empty-lab G0-D parity configuration: loopback listener, Apache default docroot, EA4 ea-php82 LSAPI.
# Requires the product build (autoDetectCdn/enableUpdateCheck). Not a production configuration.
serverName                       ols-cpanel-lab
user                             nobody
group                            nobody
autoRestart                      1
enableChroot                     0
inMemBufSize                     60M
swappingDir                      /tmp/lshttpd/swap
gracefulRestartTimeout           300
mime                             conf/mime.properties
showVersionNumber                0
adminEmails                      root@localhost
indexFiles                       index.html
disableWebAdmin                  1
autoDetectCdn                    0
enableUpdateCheck                0

errorlog logs/error.log {
    logLevel             INFO
    debugLevel           0
    rollingSize          10M
    enableStderrLog      1
}
accessLog logs/access.log {
    rollingSize          10M
    keepDays             7
}
tuning {
    maxConnections       200
    maxSSLConnections    200
    quicEnable           0
}
accessDenyDir {
    dir                  /
    dir                  /etc/*
    dir                  /dev/*
    dir                  conf/*
    dir                  admin/conf/*
}
fileAccessControl {
    followSymbolLink     2
    checkSymbolLink      1
    requiredPermissionMask    000
    restrictedPermissionMask  000
}
# Required: without this block lscgid refuses every LSAPI start (cgidSuEXEC failed).
CGIRLimit {
    maxCGIInstances      20
    minUID               11
    minGID               10
    priority             0
    CPUSoftLimit         10
    CPUHardLimit         50
    memSoftLimit         2047M
    memHardLimit         2047M
    procSoftLimit        400
    procHardLimit        450
}
accessControl {
    allow                127.0.0.1
    deny                 ALL
}
extProcessor ea-php82 {
    type                 lsapi
    address              uds://tmp/lshttpd/ea-php82.sock
    maxConns             5
    env                  PHP_LSAPI_CHILDREN=5
    initTimeout          60
    retryTimeout         0
    persistConn          1
    respBuffer           0
    autoStart            1
    path                 /opt/cpanel/ea-php82/root/usr/bin/lsphp
    backlog              50
    instances            1
    memSoftLimit         0
    memHardLimit         0
    procSoftLimit        400
    procHardLimit        500
}
virtualHost parity {
    vhRoot               /var/www/
    configFile           conf/vhosts/parity/vhconf.conf
    allowSymbolLink      0
    enableScript         1
    restrained           1
    setUIDMode           0
}
listener parity {
    address              127.0.0.1:8088
    secure               0
    map                  parity *
}
