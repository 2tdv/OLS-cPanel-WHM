# Synthetic cross-site scripting detection (offline FV-02 tests).
SecRule REQUEST_COOKIES|!REQUEST_COOKIES:/__utm|_ga/|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|XML:/* "@detectXSS" \
    "id:941100,\
    phase:2,\
    block,\
    t:none,t:utf8toUnicode,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:cssDecode,t:removeNulls,\
    msg:'XSS Attack Detected via libinjection',\
    logdata:'Matched Data: XSS data found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'paranoia-level/1',\
    severity:'CRITICAL',\
    setvar:'tx.anomaly_score_pl1=+5'"

SecRule ARGS "@rx (?i)<script[^>]*>" \
    "id:941110,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'XSS Filter - Category 1: Script Tag Vector',\
    tag:'attack-xss',\
    severity:'CRITICAL',\
    chain"
    SecRule MATCHED_VAR "!@streq x" \
        "t:none,\
        setvar:'tx.anomaly_score_pl1=+5'"

SecRule ARGS "@detectSQLi" \
    "id:942100,\
    phase:2,\
    block,\
    t:none,t:utf8toUnicode,t:urlDecodeUni,t:removeNulls,\
    msg:'SQL Injection Attack Detected via libinjection',\
    tag:'attack-sqli',\
    severity:'CRITICAL',\
    ctl:ruleRemoveTargetById=941100;ARGS:ignored,\
    setvar:'tx.anomaly_score_pl1=+5'"
